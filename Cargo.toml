[package]
name = "ipfix-parser"
version = "0.1.0"
license = "MIT"
readme = "README.md"
description = "IPFIX (RFC 7011) Parser"
repository = "https://github.com/nxthdr/ipfix-parser"
homepage = "https://nxthdr.dev"
keywords = ["ipfix", "parser", "netflow", "flow"]
edition = "2021"
exclude = [
    ".github/*",
    "benches/*",
    "tests/*",
    "codecov.yml",
    "renovate.json",
]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde"]

[dev-dependencies]
criterion = "0.8"
csv = "1"
regex = "1"
syn = { version = "2", features = ["full", "parsing"] }
ureq = "3"
serde_json = "1.0"

[[bench]]
name = "parser_benchmark"
harness = false
